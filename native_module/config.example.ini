; OpenScumRconNative config
; Copy this file to config.ini next to this mod's dlls/main.dll (i.e.
; ue4ss/Mods/OpenScumRconNative/config.ini) and adjust the values below.
; Same convention scum_rcon (Herbie's mod) uses for its own config.ini.

; Interface to bind the RCON listener to. 0.0.0.0 = all interfaces.
bind_host = 0.0.0.0

; TCP port for the RCON listener. Deliberately different from Herbie's
; default (28015) so both can run side by side during testing.
port = 28016

; RCON password. Change this - the wire protocol is unencrypted, never
; expose this port to untrusted networks.
password = changeme
