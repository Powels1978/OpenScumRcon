; OpenScumRconNative configuration / Konfiguration
; EN: Copy this example to ue4ss/Mods/OpenScumRconNative/config.ini
;     and set your own values before starting the mod.
; DE: Diese Vorlage nach ue4ss/Mods/OpenScumRconNative/config.ini kopieren
;     und vor dem Start des Mods eigene Werte festlegen.

; EN: Listener bind address. 0.0.0.0 means all interfaces.
; DE: Bind-Adresse des Listeners. 0.0.0.0 bedeutet alle Netzwerkschnittstellen.
bind_host = 0.0.0.0

; EN: TCP port, different from Herbie's default (28015) for parallel testing.
; DE: TCP-Port, abweichend von Herbies Standard (28015) für parallele Tests.
port = 28016

; EN: Replace this password. RCON is unencrypted; allow only trusted networks.
; DE: Dieses Passwort ersetzen. RCON ist unverschlüsselt; nur vertraute Netze zulassen.
password = changeme
